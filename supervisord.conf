[unix_http_server]
file=/workspace/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/supervisor.sock

[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/workspace/supervisord.pid
childlogdir=/workspace/logs

[program:netbird]
command=/usr/local/bin/netbird-entrypoint.sh
priority=10
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/netbird.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; Router-Node-Agent (pgpu): call-home, health/busy/gpu heartbeats, asset sync.
; Standalone boxes (no ROUTER_URL/PRAXIS_NODE_TOKEN) exit 0 -> expected.
[program:gpu-agent]
command=/usr/bin/python3 /opt/praxis/bin/gpu_agent_wrapper.py
priority=15
autorestart=unexpected
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/gpu-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:vosk]
command=/usr/bin/python3 /opt/praxis/bin/run_vosk.py
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/vosk.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:comfyui]
directory=/opt/ComfyUI
; --base-directory alone: the pinned ComfyUI revision derives input/output/temp/user
; from it, and appends a trailing "temp" to --temp-directory (a2afcdb main.py),
; which would otherwise create /workspace/temp/temp.
command=/opt/comfy-venv/bin/python main.py --listen 127.0.0.1 --port 8188 --base-directory /workspace --disable-auto-launch
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/logs/comfyui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true